  /api/documents:
    get:
      tags:
      - Documentos
      summary: Listar los documentos de la unidad
      description: |-
        **Quién puede usarla:** Cualquier persona con sesión (administración, portería o residente).

        Los documentos que la persona puede ver, los más nuevos primero y sin el archivo (este se pide aparte, en `/api/documents/{document_id}/file`). Cada persona ve solo los que la administración le marcó: propietarios, arrendatarios, otros residentes o portería. La administración ve todos, con a quién se los muestra (`visibleTo`), y con `includeRetired=true` también los retirados. También llegan los tipos de documento y los públicos que existen.
      operationId: documentsListDocuments
      x-endpoint: documents.list_documents
      x-roles:
      - ADMIN
      - GUARD
      - RESIDENT
      security:
      - bearerAuth: []
      parameters:
      - name: category
        in: query
        required: false
        schema:
          type: string
          enum:
          - convivencia
          - reglas
          - presupuesto
          - gastos
          - actas
          - otro
        description: Dejar solo un tipo de documento
      - name: includeRetired
        in: query
        required: false
        schema:
          type: boolean
        description: Incluir también los documentos retirados. Solo lo respeta la administración.
      responses:
        '200':
          description: Los documentos que la persona puede ver
          content:
            application/json:
              schema:
                type: object
                required:
                - documents
                - categories
                - audiences
                properties:
                  documents:
                    type: array
                    items:
                      $ref: '#/components/schemas/UnitDocument'
                  categories:
                    type: array
                    description: Los tipos de documento, en el orden en que se muestran
                    items:
                      $ref: '#/components/schemas/DocumentOption'
                  audiences:
                    type: array
                    description: A quién se le puede mostrar un documento
                    items:
                      $ref: '#/components/schemas/DocumentOption'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
      - Documentos
      summary: Subir un documento
      description: |-
        **Quién puede usarla:** Solo administración.

        Sube un documento y marca quién lo puede ver. El archivo llega como texto `data:<tipo>;base64,<datos>`: PDF, PNG, JPG o WebP de máximo 6 MB; el tipo se reconoce por los primeros bytes del archivo, no por lo que diga quien lo manda, y la extensión del nombre se corrige a la real. Dos documentos publicados no pueden llamarse igual (409). Con `notify: true` se avisa, dentro de la app y al celular, a las personas que lo pueden ver. Una lista vacía en `visibleTo` deja el documento solo para la administración.
      operationId: documentsUploadDocument
      x-endpoint: documents.upload_document
      x-roles:
      - ADMIN
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UnitDocumentInput'
      responses:
        '201':
          description: Documento publicado
          content:
            application/json:
              schema:
                type: object
                required:
                - message
                - document
                - notified
                properties:
                  message:
                    type: string
                    description: Mensaje para mostrarle a la persona, en español
                  document:
                    $ref: '#/components/schemas/UnitDocument'
                  notified:
                    type: integer
                    description: A cuántas personas se les avisó (0 si no se pidió avisar)
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
  /api/documents/{document_id}:
    get:
      tags:
      - Documentos
      summary: Ver un documento
      description: |-
        **Quién puede usarla:** Cualquier persona con sesión (administración, portería o residente).

