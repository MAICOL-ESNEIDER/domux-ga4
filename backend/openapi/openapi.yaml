      description: |-
        **Quién puede usarla:** Solo administración.

        Solo se cambia lo que se envía (al menos el nombre o una regla). Las reservas nuevas usan las reglas desde ese momento; las que ya existen no se tocan. Con `null` vuelven al valor por defecto: capacity, cancelDeadlineDays, weeklyLimit, maintenanceWeekday, maxConsecutiveSlots y allowFullDay. Se revisa que la zona abra antes de cerrar, que quepa al menos una franja y que la anticipación máxima no sea menor que la mínima. Responde 409 si otra zona vigente ya tiene ese nombre o si la zona está retirada.
