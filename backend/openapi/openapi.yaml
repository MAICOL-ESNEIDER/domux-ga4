        Cada zona dice si está abierta (`isOpen`) y, si la administración la cerró, el motivo (`closedReason`). Las zonas retiradas no se ofrecen. La administración puede pedirlas con `includeRetired=true` y además ve cuántas reservas próximas tiene cada zona (`upcomingReservations`).
