  /api/common-areas/{area_id}/close:
    post:
      tags:
      - Zonas comunes
      summary: Cerrar una zona común con un motivo
      description: |-
        **Quién puede usarla:** Solo administración.

        Mientras esté cerrada no recibe reservas nuevas y a quien la consulta se le muestra el motivo. Las reservas que ya tenía se mantienen: la administración recibe un aviso con cuántas son y `upcomingReservations` las cuenta. Si la zona ya estaba cerrada, solo cambia el motivo. El motivo lleva de 5 a 300 caracteres.
      operationId: communityCloseCommonArea
      x-endpoint: community.close_common_area
      x-roles:
      - ADMIN
      security:
      - bearerAuth: []
      parameters:
      - name: area_id
        in: path
        required: true
        description: Id de la zona común
        schema:
          type: integer
          minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - reason
              properties:
                reason:
                  type: string
                  description: Por qué se cierra; lo ven quienes consultan la zona (5 a 300 caracteres)
                  minLength: 5
                  maxLength: 300
                  example: Falla en la bomba de la piscina; el técnico viene el jueves.
              additionalProperties: false
      responses:
        '200':
          description: Zona cerrada
          content:
            application/json:
              schema:
                type: object
                required:
                - message
                - area
                - upcomingReservations
                properties:
                  message:
                    type: string
                    description: Mensaje para mostrarle a la persona, en español
                  area:
                    $ref: '#/components/schemas/CommonArea'
                  upcomingReservations:
                    type: integer
                    description: Reservas próximas que la zona tenía y se mantienen
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
