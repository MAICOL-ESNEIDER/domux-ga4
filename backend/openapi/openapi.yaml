        version:
          type: string
          description: Versión del texto publicado; nulo mientras está pendiente
          nullable: true
          example: '1.0'
        effectiveFrom:
          type: string
          description: Día desde el que rige el texto, AAAA-MM-DD; nulo mientras está pendiente
          nullable: true
          example: '2026-12-01'
