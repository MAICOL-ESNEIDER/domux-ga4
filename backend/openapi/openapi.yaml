      responses:
        '200':
          description: La ficha del hogar
          content:
            application/json:
              schema:
                type: object
                required:
                - unit
                properties:
                  unit:
                    $ref: '#/components/schemas/Household'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags:
      - Hogares
      summary: Guardar la ficha del hogar de un apartamento
      description: |-
        **Quién puede usarla:** Solo administración.

        Reemplaza las listas de miembros, mascotas y vehículos por las que se envían. Nada se borra: lo que se quita queda retirado y el cambio se anota en la auditoría. El parqueadero y el cuarto útil no se escriben aquí: se asignan en la estructura de la unidad.
      operationId: adminUpdateUnitProfile
      x-endpoint: admin.update_unit_profile
      x-roles:
      - ADMIN
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Se manda apartmentId o apartment.
              required:
              - members
              - pets
              - vehicles
              properties:
                apartmentId:
                  type: integer
                  description: Id del apartamento (es la forma recomendada)
                apartment:
                  type: string
                  description: O el texto «Torre 1 · Apto 101»
                members:
                  type: array
                  items:
                    type: object
                    required:
                    - name
                    - documentId
                    - birthDate
                    - relationship
                    properties:
                      id:
                        type: integer
                        description: Id de un miembro que ya existe; sin id se crea uno nuevo
                      name:
                        type: string
                      lastName:
                        type: string
                      documentId:
                        type: string
                      birthDate:
                        type: string
                        description: AAAA-MM-DD
                        example: '2026-12-01'
                        format: date
                      phone:
                        type: string
                      relationship:
                        type: string
                        description: Parentesco
                        enum:
                        - propietario
                        - conyuge_pareja
                        - hijo
                        - hija
                        - padre
                        - madre
                        - hermano
                        - hermana
                        - abuelo
                        - abuela
                        - tio
                        - tia
                        - primo
                        - prima
                        - yerno
                        - nuera
                        - suegro
                        - suegra
                        - otro
                      otherRelationship:
                        type: string
                        description: Obligatorio cuando el parentesco es «otro»
                pets:
                  type: array
                  items:
                    type: object
                    required:
                    - name
                    - species
                    - breed
                    - ageYears
                    properties:
                      id:
                        type: integer
                        description: Id de una mascota que ya existe
                      name:
                        type: string
                      species:
                        type: string
                      breed:
                        type: string
                      ageYears:
                        type: integer
                        description: De 0 a 100
                        minimum: 0
                        maximum: 100
                      vaccinesUpToDate:
                        type: boolean
                        description: Vacunas al día
                      lastVaccinationDate:
                        type: string
                        description: Obligatoria si las vacunas están al día; no puede ser futura
                        example: '2026-12-01'
                        format: date
                      dewormingUpToDate:
                        type: boolean
                        description: Desparasitación al día
                      lastDewormingDate:
                        type: string
                        description: Obligatoria si la desparasitación está al día; no puede ser futura
                        example: '2026-12-01'
                        format: date
                vehicles:
                  type: array
                  items:
                    type: object
                    required:
                    - plate
                    - type
                    - makeModel
                    - year
                    - registeredOwner
                    properties:
                      id:
                        type: integer
                        description: Id de un vehículo que ya existe
                      plate:
                        type: string
                        description: Placa colombiana, por ejemplo ABC123 o ABC12D
                      type:
                        type: string
                        enum:
                        - carro
                        - moto
                      makeModel:
                        type: string
                      year:
                        type: integer
                      registeredOwner:
                        type: string
                      color:
                        type: string
                petInsurance:
                  type: boolean
                  description: Si las mascotas tienen seguro
                petInsurer:
                  type: string
                  description: Aseguradora (solo si hay seguro)
                  nullable: true
      responses:
        '200':
          description: Ficha actualizada
          content:
            application/json:
              schema:
                type: object
                required:
                - message
                - unit
                properties:
                  message:
                    type: string
                    description: Mensaje para mostrarle a la persona, en español
                  unit:
                    $ref: '#/components/schemas/Household'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
