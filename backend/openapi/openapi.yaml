  /api/documents/{document_id}/file:
    get:
      tags:
      - Documentos
      summary: Descargar el archivo de un documento
      description: |-
        **Quién puede usarla:** Cualquier persona con sesión (administración, portería o residente).

        El PDF o la imagen del documento, con su tipo real y su nombre. Si no cambió desde la última vez (cabecera `If-None-Match`) responde 304 sin cuerpo. Si la persona no puede ver el documento responde 404. La respuesta no puede cargar ni ejecutar nada (`Content-Security-Policy`).
      operationId: documentsGetDocumentFile
      x-endpoint: documents.get_document_file
      x-roles:
      - ADMIN
      - GUARD
      - RESIDENT
      security:
      - bearerAuth: []
      parameters:
      - name: document_id
        in: path
        required: true
        description: Id del documento
        schema:
          type: integer
          minimum: 1
      - name: If-None-Match
        in: header
        required: false
        description: El ETag que se recibió la última vez
        schema:
          type: string
      responses:
        '200':
          description: El archivo del documento (PDF, PNG, JPG o WebP)
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
          headers:
            ETag:
              description: 'Huella del archivo: sirve para preguntar después si cambió'
              schema:
                type: string
            Content-Disposition:
              description: Cómo se muestra (`inline`) y con qué nombre
              schema:
                type: string
        '304':
          description: No cambió desde la última descarga
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/documents/{document_id}/restore:
    post:
      tags:
      - Documentos
      summary: Volver a publicar un documento retirado
      description: |-
        **Quién puede usarla:** Solo administración.

        Vuelve a mostrar el documento a quienes lo veían. Si ya está publicado responde 409, y también si mientras tanto se publicó otro documento con el mismo título.
      operationId: documentsRestoreDocument
      x-endpoint: documents.restore_document
      x-roles:
      - ADMIN
      security:
      - bearerAuth: []
      parameters:
      - name: document_id
        in: path
        required: true
        description: Id del documento
        schema:
          type: integer
          minimum: 1
      responses:
        '200':
          description: Documento publicado de nuevo
          content:
            application/json:
              schema:
                type: object
                required:
                - message
                - document
                properties:
                  message:
                    type: string
                    description: Mensaje para mostrarle a la persona, en español
                  document:
                    $ref: '#/components/schemas/UnitDocument'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/admin/unit-rules:
    get:
      tags:
      - Unidad
      summary: Ver las reglas de la unidad
      description: |-
        **Quién puede usarla:** Solo administración.

        Las reglas vigentes (plazos de PQRS, horas de alerta de los paquetes y días del parqueadero de visitantes), los valores con los que viene DOMUX, cuáles cambió la administración y quién hizo el último cambio.
      operationId: unitGetUnitRules
      x-endpoint: unit.get_unit_rules
      x-roles:
      - ADMIN
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Las reglas de la unidad
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnitRulesView'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    put:
      tags:
      - Unidad
      summary: Cambiar las reglas de la unidad
      description: |-
        **Quién puede usarla:** Solo administración.

        Solo cambia lo que se envía. Una regla enviada como `null` vuelve al valor de DOMUX. Se revisa cada valor (con su mínimo y su máximo) y que las reglas tengan sentido juntas: los días del aviso amarillo no pueden ser más que el plazo general y el aviso rojo de un paquete debe llegar después del naranja. Los cambios rigen desde que se guardan, también para lo que ya existe (por ejemplo, el semáforo de las PQRS abiertas se calcula de nuevo). Queda anotado en la auditoría con los valores de antes y de después.
      operationId: unitUpdateUnitRules
      x-endpoint: unit.update_unit_rules
      x-roles:
      - ADMIN
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UnitRulesInput'
      responses:
        '200':
          description: Reglas guardadas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnitRulesView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
