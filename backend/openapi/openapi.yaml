                - pageSize
                - total
                - totalPages
                properties:
                  users:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
                  page:
                    type: integer
                    description: Página que se devuelve (empieza en 1)
                    example: 1
                  pageSize:
                    type: integer
                    description: Cuántos elementos caben en cada página
                    example: 25
                  total:
                    type: integer
                    description: Cuántos elementos hay en total con esos filtros
                  totalPages:
                    type: integer
                    description: Cuántas páginas hay
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
      - Usuarios
      summary: Crear una cuenta
      description: |-
        **Quién puede usarla:** Solo administración.

        Es la misma ruta que su equivalente bajo `/api/admin/users`; se conserva para las versiones que ya la usan.

        La contraseña la escribe la administración y es temporal: la persona debe cambiarla al entrar (`mustChangePassword`).
      operationId: adminCreateUserAlias
      x-endpoint: admin.create_user
      x-roles:
      - ADMIN
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Para un residente también son obligatorios occupancyType, dataProcessingConsent y el
                apartamento (apartmentId o apartment).
              required:
              - name
              - email
              - password
              - role
              properties:
                name:
                  type: string
                  description: Nombres
                lastName:
                  type: string
                  description: Apellidos
                email:
                  type: string
                  description: Correo (debe ser único)
                password:
                  type: string
                  description: Mínimo 8 caracteres con una mayúscula, una minúscula, un número y un carácter especial
                    (@$!%*?&#._-)
                role:
                  type: string
                  description: Rol de la cuenta
                  enum:
                  - ADMIN
                  - GUARD
                  - RESIDENT
                phone:
                  type: string
                  description: Teléfono de Colombia con 10 números; se acepta +57 al inicio
                documentId:
                  type: string
                  description: Documento de identidad
                birthDate:
                  type: string
                  description: AAAA-MM-DD, no puede ser futura
                  example: '2026-12-01'
                  format: date
                parentalConsent:
                  type: boolean
                  description: Autorización de un adulto, si es menor
                occupancyType:
                  type: string
                  description: Obligatorio para residentes
                  enum:
                  - propietario
                  - arrendatario
                  - residente
                apartmentId:
                  type: integer
                  description: Id del apartamento (es la forma recomendada)
                apartment:
                  type: string
                  description: O el texto «Torre 1 · Apto 101»
                dataProcessingConsent:
                  type: boolean
                  description: 'Obligatorio y verdadero para residentes: la unidad tiene su autorización de datos'
      responses:
        '201':
          description: Cuenta creada
          content:
            application/json:
              schema:
                type: object
                required:
                - message
                - user
                properties:
                  message:
                    type: string
                    description: Mensaje para mostrarle a la persona, en español
                  user:
                    $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
