        ordered:
          type: boolean
          description: 'Solo en `list`: verdadero si es numerada (los números los pone quien la dibuja)'
        items:
          type: array
          items:
            type: string
          description: 'Solo en `list`: los elementos, en orden'
    LegalDocument:
      type: object
      description: Un documento legal completo.
      required:
      - slug
      - title
      - summary
      - status
      - version
      - effectiveFrom
      - blocks
      properties:
        slug:
          type: string
          description: Nombre del documento; es el que va en la dirección
          example: politica-datos
          enum:
          - politica-datos
          - aviso-privacidad
          - autorizacion-datos
          - terminos
          - consultas-reclamos
          - cookies
          - responsable
          - licencias-terceros
        title:
          type: string
          description: Título del documento
          example: Política de tratamiento de datos personales
        summary:
          type: string
          description: Una frase que dice de qué trata
        status:
          type: string
          description: '«pendiente»: todavía no tiene su texto final ni validez; «vigente»: ya está publicado'
          enum:
          - pendiente
          - vigente
        version:
          type: string
          description: Versión del texto publicado; nulo mientras está pendiente
          nullable: true
