  /api/search:
    get:
      tags:
      - Buscador
      summary: Buscar en todo o en un solo lugar
      description: |-
        **Quién puede usarla:** Solo administración, portería.

        El buscador general con el filtro «Buscar en» (HU-089). Busca el texto en personas, apartamentos, vehículos (por
        placa, de residentes y de visitantes que están adentro), PQRS (por radicado, asunto o residente), paquetes y
        visitas, y devuelve los resultados agrupados por tipo, ya con el texto que se muestra. Con menos de 2 letras no
        busca (`tooShort` es true). Al buscar en todo llegan hasta 5 por grupo; en un solo lugar, hasta 20 (`more` dice
        si hay más).

        La portería busca con las reglas de siempre: solo residentes activos, por nombre, documento o apartamento (nunca
        por correo), sin teléfonos ni correos, sin PQRS (403 si las pide) y como mucho 5 por grupo. `places` trae las
        opciones del filtro que tiene cada rol.
      operationId: searchEverywhere
      x-endpoint: search.search
      x-roles:
      - ADMIN
      - GUARD
      security:
      - bearerAuth: []
      parameters:
      - name: q
        in: query
        required: false
        schema:
          type: string
          maxLength: 100
        description: Lo que se busca
      - name: in
        in: query
        required: false
        schema:
          type: string
          enum:
          - todo
          - personas
          - apartamentos
          - vehiculos
          - pqrs
          - paquetes
          - visitas
        description: Dónde se busca (por defecto, en todo)
      responses:
        '200':
          description: Los resultados, agrupados por tipo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
