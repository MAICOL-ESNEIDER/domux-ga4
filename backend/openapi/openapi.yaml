    UnitDocument:
      type: object
      description: Un documento de la unidad, sin el archivo. Los campos `visibleTo`, `isRetired`, `retiredAt` y `retiredByName` solo los ve la administración.
      required:
      - id
      - title
      - description
      - category
      - categoryLabel
      - fileName
      - mimeType
      - kind
      - sizeBytes
      - version
      - createdAt
      - updatedAt
      - uploadedByName
      properties:
        id:
          type: integer
        title:
          type: string
          description: Único entre los documentos publicados (sin importar mayúsculas)
          example: Manual de convivencia
        description:
          type: string
          nullable: true
          example: Versión aprobada en la asamblea de marzo.
        category:
          type: string
          enum:
          - convivencia
          - reglas
          - presupuesto
          - gastos
          - actas
          - otro
        categoryLabel:
          type: string
          example: Manual de convivencia
        fileName:
          type: string
          description: Con la extensión del tipo real del archivo
          example: manual-convivencia.pdf
        mimeType:
          type: string
          enum:
          - application/pdf
          - image/png
          - image/jpeg
          - image/webp
        kind:
          type: string
          description: Cómo mostrarlo
          enum:
          - pdf
          - image
        sizeBytes:
          type: integer
          example: 245760
        version:
          type: string
          description: Cambia solo si cambia el archivo; sirve para no descargarlo de nuevo
          example: 3fa81c0d9b2e
        createdAt:
          type: string
          nullable: true
          description: AAAA-MM-DD HH:MM
        updatedAt:
          type: string
          nullable: true
          description: AAAA-MM-DD HH:MM
        uploadedByName:
          type: string
          nullable: true
        visibleTo:
          type: array
          description: Solo la administración. A quién se le muestra; vacía es solo la administración.
          items:
            type: string
            enum:
            - propietario
            - arrendatario
            - residente
            - guardia
        isRetired:
          type: boolean
          description: Solo la administración
        retiredAt:
          type: string
          nullable: true
          description: Solo la administración. AAAA-MM-DD HH:MM
        retiredByName:
          type: string
          nullable: true
          description: Solo la administración
    UnitDocumentInput:
      type: object
      description: Un documento nuevo.
      required:
      - title
      - file
      - visibleTo
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 150
          example: Presupuesto aprobado 2027
        description:
          type: string
          nullable: true
          maxLength: 500
        category:
          type: string
          description: Si no se envía, «otro»
          enum:
          - convivencia
          - reglas
          - presupuesto
          - gastos
          - actas
          - otro
        file:
          type: string
          description: El archivo como `data:<tipo>;base64,<datos>`. PDF, PNG, JPG o WebP de máximo 6 MB.
          example: data:application/pdf;base64,JVBERi0xLjQK...
        fileName:
          type: string
          description: El nombre del archivo; si falta se usa el título. La extensión se corrige a la del tipo real.
          example: presupuesto-2027.pdf
        visibleTo:
          type: array
          description: A quién se le muestra. Vacía es solo la administración.
          items:
            type: string
            enum:
            - propietario
            - arrendatario
            - residente
            - guardia
        notify:
          type: boolean
          description: Avisar a las personas que lo pueden ver (por defecto no)
    UnitDocumentChanges:
