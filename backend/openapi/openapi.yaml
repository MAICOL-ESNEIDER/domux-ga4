        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags:
      - Documentos
      summary: Cambiar un documento
      description: |-
        **Quién puede usarla:** Solo administración.

        Cambia el título, la descripción, el tipo o quién ve el documento; solo lo que se envíe. El archivo no se cambia: para publicar otra versión se sube un documento nuevo y se retira este. Un documento retirado no se puede cambiar (409). Los cambios quedan en la auditoría con lo de antes y lo de después. Una descripción `null` la quita.
      operationId: documentsUpdateDocument
