  /api/auth/accept-legal:
    post:
      tags:
      - Sesión
      summary: Aceptar los textos legales (pantalla «Acepto»)
      description: |-
        **Quién puede usarla:** Cualquier persona con sesión (administración, portería o residente).

        La persona acepta los términos de uso, la política de tratamiento de datos y la autorización para tratarlos. Se guarda cuándo aceptó y cuál versión de los textos leyó (`version`, la que entregó `GET /api/auth/legal-acceptance`). Si los textos cambiaron mientras tanto, responde **409** con la versión nueva y no guarda nada: nadie acepta algo que no vio. Queda en la auditoría.
      operationId: authAcceptLegal
      x-endpoint: auth.accept_legal
      x-roles:
      - ADMIN
      - GUARD
      - RESIDENT
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - accepted
              - version
              properties:
                accepted:
                  type: boolean
                  description: Debe ser verdadero; la persona marcó que leyó y acepta
                version:
                  type: string
                  description: La versión de los textos que la persona vio
                  example: 'terminos:0.1|politica-datos:0.1|autorizacion-datos:0.1'
      responses:
        '200':
          description: Aceptación registrada
          content:
            application/json:
              schema:
                type: object
                required:
                - message
                - user
                properties:
                  message:
                    type: string
                    description: Mensaje para mostrarle a la persona, en español
                  user:
                    $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
