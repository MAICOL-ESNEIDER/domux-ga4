components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'El token que devuelve `POST /api/auth/login`, enviado como `Authorization: Bearer <token>`.'
  responses:
    BadRequest:
      description: Los datos enviados no sirven. El texto de `error` explica cuál es el problema.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Falta la sesión, el token venció o ya no sirve (cuenta desactivada o contraseña cambiada).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: 'La persona no tiene permiso para esta ruta (su rol no está en `x-roles`), debe cambiar su contraseña
        (`passwordChangeRequired: true`) o debe aceptar los textos legales (`legalAcceptanceRequired: true`).'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: No existe, o quien consulta no tiene derecho a verlo.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: 'Choca con el estado actual: algo repetido, un paquete ya entregado, un parqueadero ya ocupado...'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    PayloadTooLarge:
      description: La solicitud pesa más de 12 MB o un adjunto pasa de 6 MB.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: 'Demasiados intentos fallidos: hay que esperar el tiempo del encabezado `Retry-After`.'
      headers:
        Retry-After:
          description: Segundos que faltan para poder intentarlo otra vez
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      description: 'Así responde el servidor cuando algo sale mal. Algunos errores traen datos extra que la app
        usa para actuar: passwordChangeRequired (403, hay que cambiar la contraseña), legalAcceptanceRequired (403, hay que
        aceptar los textos legales), version (409 al aceptar: la versión nueva de los textos), plates (409, placas repetidas),
        noFreeSpots y suggestedSpot (409 al registrar la entrada de un vehículo: si no quedan parqueaderos libres
        y cuál se sugiere), failedPqrsIds y updatedCount (respuesta por lotes).'
      required:
      - error
      - status
      properties:
        error:
          type: string
          description: Qué pasó, en español claro
          example: Credenciales inválidas
        status:
          type: integer
          description: El mismo código HTTP de la respuesta
          example: 401
        passwordChangeRequired:
          type: boolean
