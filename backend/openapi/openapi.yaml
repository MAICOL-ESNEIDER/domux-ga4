  /api/announcements:
    get:
      tags:
      - Comunicados
      summary: Listar los comunicados
      description: |-
        **Quién puede usarla:** Solo administración, portería, residentes.

        Del más nuevo al más antiguo. Un residente solo ve los de toda la unidad y los de su torre. Los retirados no salen. `unreadCount` dice cuántos comunicados vigentes le faltan por leer.
      operationId: communityGetAnnouncements
      x-endpoint: community.get_announcements
      x-roles:
      - ADMIN
      - GUARD
      - RESIDENT
      security:
      - bearerAuth: []
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
        description: Página que quieres (empieza en 1)
      - name: pageSize
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
        description: Cuántos elementos por página (de 1 a 200)
      - name: view
        in: query
        required: false
        schema:
          type: string
          enum:
          - summary
        description: Con `summary` la respuesta es la lista liviana y paginada que usa la web.
      - name: archived
        in: query
        required: false
        schema:
          type: boolean
        description: Verdadero trae los comunicados que ya vencieron; por defecto salen los vigentes. Acepta true,
          false, 1, 0, si y no.
      - name: unread
        in: query
        required: false
        schema:
          type: boolean
        description: 'Solo para residentes: verdadero trae los que todavía no ha leído. Acepta true, false, 1, 0,
          si y no.'
      - name: category
        in: query
        required: false
        schema:
          type: string
          enum:
          - mantenimiento
          - urgente
          - asamblea
          - seguridad
          - zonas_comunes
        description: Solo los de esa categoría
      - name: towerId
        in: query
        required: false
        schema:
          type: string
        description: 'Solo con `view=summary`: el número de una torre, o `unit` para los de toda la unidad'
      - name: search
        in: query
        required: false
        schema:
          type: string
        description: Texto que se busca (también se acepta con el nombre `q`)
      responses:
        '200':
          description: Los comunicados de esta página
          content:
            application/json:
              schema:
                type: object
                required:
                - announcements
                - page
                - pageSize
                - total
                - totalPages
                - unreadCount
                properties:
                  announcements:
                    type: array
                    items:
                      $ref: '#/components/schemas/Announcement'
                  page:
                    type: integer
                    description: Página que se devuelve (empieza en 1)
                    example: 1
                  pageSize:
                    type: integer
                    description: Cuántos elementos caben en cada página
                    example: 25
                  total:
                    type: integer
                    description: Cuántos elementos hay en total con esos filtros
                  totalPages:
                    type: integer
                    description: Cuántas páginas hay
                  unreadCount:
                    type: integer
                    description: Comunicados vigentes sin leer por quien consulta
                  counts:
                    type: object
                    description: Solo con view=summary
                    required:
                    - current
                    - archived
                    properties:
                      current:
                        type: integer
                        description: Vigentes
                      archived:
                        type: integer
                        description: Vencidos
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
      - Comunicados
      summary: Publicar un comunicado
      description: |-
        **Quién puede usarla:** Solo administración.

        Les llega una notificación a los residentes de la torre elegida (o a todos si no se elige torre). Adjuntos: image, video o audio, y también document (PDF).
      operationId: communityCreateAnnouncement
      x-endpoint: community.create_announcement
      x-roles:
      - ADMIN
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - title
              - message
              properties:
                title:
                  type: string
                  description: Título (hasta 150 caracteres)
                  maxLength: 150
                message:
                  type: string
                  description: Texto del comunicado
                category:
                  type: string
                  description: Categoría (por defecto, mantenimiento)
                  enum:
                  - mantenimiento
                  - urgente
                  - asamblea
                  - seguridad
                  - zonas_comunes
                towerId:
                  type: integer
                  description: Torre a la que va; sin torre es para toda la unidad
                  nullable: true
                  minimum: 1
                expiresAt:
                  type: string
                  description: Fecha de vencimiento, AAAA-MM-DD
                  nullable: true
                  example: '2026-12-01'
                  format: date
                eventDate:
                  type: string
                  description: Fecha del evento, AAAA-MM-DD
                  nullable: true
                  example: '2026-12-01'
                  format: date
                eventTime:
                  type: string
                  description: Hora del evento, HH:MM
                  nullable: true
                  example: 08:00
                  pattern: ^\d{2}:\d{2}$
                mediaUrl:
                  type: string
                  description: Archivo como «data:<tipo>;base64,<datos>». El servidor revisa el contenido real del
                    archivo y no deja pasar más de 6 MB. Si se envía, hay que enviar también mediaType.
                mediaType:
                  type: string
                  description: Tipo del archivo
                  enum:
                  - image
                  - video
                  - audio
                  - document
                mediaDownloadable:
                  type: boolean
                  description: Si quien lo ve puede descargarlo (por defecto, sí)
      responses:
        '201':
          description: Comunicado publicado
          content:
            application/json:
              schema:
                type: object
                required:
                - message
                - announcement
                properties:
                  message:
                    type: string
                    description: Mensaje para mostrarle a la persona, en español
                  announcement:
                    $ref: '#/components/schemas/Announcement'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
  /api/announcements/{announcement_id}:
