    get:
      tags:
      - Unidad
      summary: Descargar el logo de la unidad
      description: |-
        **Quién puede usarla:** Cualquier persona con sesión (administración, portería o residente).

        La imagen del logo. Si no cambió desde la última vez (cabecera `If-None-Match`) responde 304 sin cuerpo. Responde 404 si la unidad no tiene logo.
      operationId: unitGetUnitLogo
      x-endpoint: unit.get_unit_logo
      x-roles:
      - ADMIN
      - GUARD
      - RESIDENT
      security:
      - bearerAuth: []
      parameters:
      - name: If-None-Match
        in: header
        required: false
        description: El ETag que se recibió la última vez
        schema:
          type: string
      responses:
        '200':
          description: La imagen del logo (PNG, JPG o WebP)
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
          headers:
            ETag:
              description: 'Huella del logo: sirve para preguntar después si cambió'
              schema:
                type: string
        '304':
          description: No cambió desde la última descarga
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/users:
    get:
      tags:
      - Usuarios
      summary: Listar y buscar cuentas
      description: |-
        **Quién puede usarla:** Solo administración.

        Es la misma ruta que su equivalente bajo `/api/admin/users`; se conserva para las versiones que ya la usan.

        Lista paginada con todos los filtros de la web de administración.
      operationId: adminGetUsersAlias
      x-endpoint: admin.get_users
      x-roles:
      - ADMIN
      security:
      - bearerAuth: []
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
        description: Página que quieres (empieza en 1)
      - name: pageSize
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 25
        description: Cuántos elementos por página (de 1 a 100)
      - name: search
        in: query
        required: false
        schema:
          type: string
        description: Texto que se busca en nombre, correo, teléfono, documento, apartamento y hogar
      - name: role
        in: query
        required: false
        schema:
          type: string
          enum:
          - ADMIN
          - GUARD
          - RESIDENT
        description: Solo las cuentas de ese rol
      - name: occupancyType
        in: query
        required: false
        schema:
          type: string
          enum:
          - propietario
          - arrendatario
          - residente
        description: Solo los residentes de ese tipo
      - name: apartmentFrom
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
        description: Número de apartamento desde el que se busca
      - name: apartmentTo
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
        description: Número de apartamento hasta el que se busca
      - name: hasPets
        in: query
        required: false
        schema:
          type: boolean
        description: Solo los hogares con mascotas (o sin ellas si es falso). Acepta true, false, 1, 0, si y no.
      - name: hasVehicles
        in: query
        required: false
        schema:
          type: boolean
        description: Solo los hogares con vehículos. Acepta true, false, 1, 0, si y no.
      - name: hasParking
        in: query
        required: false
        schema:
          type: boolean
        description: Solo los apartamentos con parqueadero. Acepta true, false, 1, 0, si y no.
      - name: hasStorage
        in: query
        required: false
        schema:
          type: boolean
        description: Solo los apartamentos con cuarto útil. Acepta true, false, 1, 0, si y no.
      - name: isActive
        in: query
        required: false
        schema:
          type: boolean
        description: Solo las cuentas activas (o las desactivadas si es falso). Acepta true, false, 1, 0, si y no.
      - name: minAge
        in: query
        required: false
        schema:
