          - autorizacion-datos
          - terminos
          - consultas-reclamos
          - cookies
          - responsable
          - licencias-terceros
        title:
          type: string
          description: Título del documento
          example: Política de tratamiento de datos personales
        summary:
          type: string
          description: Una frase que dice de qué trata
        status:
          type: string
          description: '«pendiente»: todavía no tiene su texto final ni validez; «vigente»: ya está publicado'
          enum:
          - pendiente
