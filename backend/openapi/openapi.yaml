  /api/packages:
    get:
      tags:
      - Paquetes
      summary: Listar los paquetes
      description: |-
        **Quién puede usarla:** Solo administración, portería, residentes.

        Del más nuevo al más antiguo. Un residente solo ve los suyos (si pide los de otro, responde 403). Sin `status` salen los que no están archivados. Los paquetes entregados hace más de 7 días se archivan solos. **Sin `view`** devuelve la lista completa, sin páginas. **Con `view=summary`** devuelve la lista liviana y paginada de la web (sin la foto) con `counts`; ahí también vale `status=todos`.
      operationId: securityGetPackages
      x-endpoint: security.get_packages
      x-roles:
      - ADMIN
      - GUARD
      - RESIDENT
      security:
      - bearerAuth: []
      parameters:
      - name: view
        in: query
        required: false
        schema:
          type: string
          enum:
          - summary
        description: Con `summary` la respuesta es la lista liviana y paginada que usa la web.
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - por_llegar
          - pendiente
          - entregado
          - archivados
          - papelera
          - todos
        description: '`archivados` (o `papelera`, el nombre de antes) trae los archivados; `todos` solo existe con
          view=summary'
      - name: residentId
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
        description: Solo los de ese residente
      - name: search
        in: query
        required: false
        schema:
          type: string
        description: Texto que se busca (también se acepta con el nombre `q`)
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
        description: Página que quieres (empieza en 1)
      - name: pageSize
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 25
        description: Cuántos elementos por página (de 1 a 100)
      responses:
        '200':
          description: Los paquetes
          content:
            application/json:
              schema:
                type: object
                required:
                - packages
                properties:
                  packages:
                    type: array
                    items:
                      oneOf:
                      - $ref: '#/components/schemas/Package'
                      - $ref: '#/components/schemas/PackageSummary'
                    description: Con view=summary son filas livianas (PackageSummary)
                  page:
                    type: integer
                    description: Solo con view=summary
                  pageSize:
                    type: integer
                    description: Solo con view=summary
                  total:
                    type: integer
                    description: Solo con view=summary
                  totalPages:
                    type: integer
                    description: Solo con view=summary
                  counts:
                    type: object
                    description: Solo con view=summary
                    required:
                    - waiting
                    - incoming
                    - delivered
                    - trash
                    - all
                    properties:
                      waiting:
                        type: integer
                        description: En portería
                      incoming:
                        type: integer
                        description: Por llegar
                      delivered:
                        type: integer
                        description: Entregados
                      trash:
                        type: integer
                        description: Archivados
                      all:
                        type: integer
                        description: Total
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
      - Paquetes
      summary: Registrar un paquete
      description: |-
        **Quién puede usarla:** Solo administración, portería.

        Le llega una notificación al residente. `pendiente` es un paquete que ya está en portería (empieza a contar el tiempo sin reclamar) y `por_llegar` uno que todavía no ha llegado. Adjunto: image, video o audio.
      operationId: securityRegisterPackage
      x-endpoint: security.register_package
      x-roles:
      - ADMIN
      - GUARD
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - residentId
              - description
              properties:
                residentId:
                  type: integer
                  description: Residente al que llega
                  minimum: 1
                description:
                  type: string
                  description: Qué es o cómo se reconoce
                status:
                  type: string
                  description: Estado inicial (por defecto, pendiente)
                  enum:
                  - pendiente
                  - por_llegar
                carrier:
                  type: string
                  description: Transportadora (hasta 60 caracteres)
                  maxLength: 60
                trackingNumber:
                  type: string
                  description: Número de guía (hasta 60 caracteres)
                  maxLength: 60
                mediaUrl:
                  type: string
                  description: Foto del paquete como «data:image/...;base64,...» (máximo 6 MB)
                mediaType:
                  type: string
                  enum:
                  - image
                  - video
                  - audio
                eventDate:
                  type: string
                  description: Día en que llegó, AAAA-MM-DD
                  example: '2026-12-01'
                  format: date
                eventTime:
                  type: string
                  description: Hora en que llegó, HH:MM
                  example: 08:00
                  pattern: ^\d{2}:\d{2}$
      responses:
        '201':
          description: Paquete registrado
          content:
            application/json:
              schema:
                type: object
                required:
                - message
                - packageItem
                properties:
                  message:
                    type: string
                    description: Mensaje para mostrarle a la persona, en español
                  packageItem:
                    $ref: '#/components/schemas/Package'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
