openapi: 3.0.3
info:
  title: API de DOMUX
  version: 1.0.0-rc.1
  description: |
    Esta es la **API de DOMUX**: el servidor al que se conectan la aplicación Android y la web de administración
    de una unidad residencial (administración, portería y residentes).

    Este archivo es el **contrato** de la API: dice qué rutas hay, quién puede usarlas, qué datos reciben y qué
    devuelven. Una prueba automática (`backend/tests/test_api_contract.py`) lo compara con el servidor real en cada
    cambio, así que si algo no coincide, el pipeline falla.

    ## Cómo se inicia sesión

    Se llama a `POST /api/auth/login` con el correo y la contraseña. La respuesta trae un `token` (un JWT, una
    «llave» firmada que dura 7 días). Todas las demás rutas piden ese token en el encabezado
    `Authorization: Bearer <token>`, salvo las públicas: `GET /api/health` y los documentos legales (`GET /api/legal` y
    `GET /api/legal/{slug}`), que se pueden leer antes de iniciar sesión.

    - Sin token, o con un token vencido o inválido, la respuesta es **401**.
    - Si la cuenta se desactivó o se cambió su contraseña, los tokens anteriores dejan de servir (401).
    - Si la persona tiene pendiente cambiar la contraseña que le puso la administración, todas las rutas responden
      **403** con `passwordChangeRequired: true`, salvo `GET /api/auth/session` y `PUT /api/auth/password`.
    - Si la persona todavía no aceptó los textos legales (la pantalla «Acepto»), o los textos cambiaron desde que
      aceptó, todas las rutas responden **403** con `legalAcceptanceRequired: true`, salvo `GET /api/auth/session`,
      `GET /api/auth/legal-acceptance`, `POST /api/auth/accept-legal` y la lectura de los textos legales.
    - Si el rol de la persona no está en la lista de la ruta (`x-roles`), la respuesta es **403**.
    - Al quinto intento fallido seguido de inicio de sesión con el mismo correo (o de PIN de guardia), ese correo (o ese
      PIN) queda bloqueado 15 minutos: la respuesta es **429** con el encabezado `Retry-After` (segundos que faltan).

    ## Los tres roles

    | Rol | Quién es |
    |---|---|
    | `ADMIN` | La administración de la unidad |
    | `GUARD` | La portería (la tablet, con turnos por PIN) |
    | `RESIDENT` | Cada residente |

    Cada ruta dice en `x-roles` qué roles la pueden usar.

    ## Formatos que se repiten

    - **Fechas y horas:** la hora siempre es la de Colombia. Un momento se escribe `AAAA-MM-DD HH:MM`
      (por ejemplo `2026-11-10 21:30`; no es el formato ISO 8601 con «T»). Un día es `AAAA-MM-DD`, una hora es `HH:MM`
      y una franja de reserva es `HH:MM-HH:MM`.
    - **Apartamento:** se escribe «Torre 1 · Apto 101». Para elegirlo se usa el `apartmentId`.
    - **Teléfonos:** de Colombia, se guardan con los 10 números (se acepta escribir `+57` al inicio).
    - **Contraseñas nuevas:** mínimo 8 caracteres con una mayúscula, una minúscula, un número y un carácter especial
      de `@$!%*?&#._-`. El PIN de un guardia son exactamente 4 dígitos escritos como texto.
    - **Placas:** de Colombia, `ABC123` (carro) o `ABC12D` (moto).
    - **Adjuntos:** viajan dentro del JSON como texto `data:<tipo>;base64,<datos>`, de máximo 6 MB, y el servidor
      revisa el contenido real del archivo. Los tipos son `image`, `video` y `audio`; también `document` (PDF), pero
      solo en PQRS, reservas y comunicados. Si una solicitud pesa más de 12 MB responde **413**.
    - **Cuerpo de la solicitud:** las rutas que reciben datos (POST y PUT) piden JSON (`Content-Type: application/json`).
      Un cuerpo que no sea un objeto JSON se rechaza con 400.
    - **Textos vacíos:** un texto en blanco en el cuerpo de una solicitud se rechaza con 400.

    ## Listas

    Las listas largas usan `page` (desde 1) y `pageSize` y responden `{ <lista>, page, pageSize, total, totalPages }`.
    El tamaño por defecto y el máximo dependen de la ruta. Algunas listas (PQRS, reservas, paquetes) sin `view` devuelven
    todo sin páginas, porque así las usa la app.

    ## La vista liviana: `view=summary`

    La web pide `?view=summary` (es el único valor que se acepta) para recibir listas y detalles **sin el contenido de los
    adjuntos**: en lugar de `mediaUrl` o la foto traen `hasMedia` o `hasPhoto`, más los contadores `counts` que
    necesitan las pestañas. Cualquier otro valor responde 400.

    ## Cómo se ve un error

    Todos los errores tienen la misma forma: `{ "error": "texto en español", "status": 400 }`, a veces con datos extra
    que se explican en el esquema `Error`. Los códigos que usa el servidor:

    | Código | Cuándo |
    |---|---|
    | 400 | La solicitud tiene datos que no sirven, por ejemplo un cuerpo que no es JSON o un texto en blanco (el texto del error dice cuál) |
    | 401 | Falta la sesión o ya no sirve |
    | 403 | La persona no tiene permiso o debe cambiar su contraseña |
    | 404 | No existe (también una dirección que no está en este contrato), o la persona no puede verlo |
    | 405 | La dirección existe, pero no con ese método (por ejemplo un DELETE donde solo hay GET) |
    | 409 | Choca con el estado actual (algo repetido, ya entregado, ya ocupado...) |
    | 413 | La solicitud pesa más de 12 MB |
    | 429 | Demasiados intentos: hay que esperar |
    | 500 | Falla interna del servidor |

    ## Lo que este contrato no incluye

    La web de administración (`/web/...`) son páginas HTML para un navegador, no una API; por eso no está aquí. La ruta
    `GET /` y los archivos estáticos tampoco.
servers:
- url: http://localhost:5000
  description: Servidor local (la entrega de la versión reducida corre en local)
- url: http://10.0.2.2:5000
  description: El mismo servidor local visto desde el emulador de Android
tags:
- name: Salud
  description: Revisar que el servidor responde
- name: Sesión
  description: Iniciar sesión, cambiar la contraseña y el turno de portería
- name: Usuarios
  description: Cuentas de la aplicación (solo administración)
- name: Residentes
  description: Buscar residentes y el perfil de cada residente
- name: Administración
  description: Censo, resumen de lo pendiente, reportes y archivo del historial
- name: Hogares
  description: 'La ficha del hogar de un apartamento: integrantes, mascotas y vehículos'
- name: Unidad
  description: Datos de la unidad residencial
- name: Estructura
  description: Torres, apartamentos, parqueaderos y cuartos útiles
- name: Comunicados
  description: Avisos de la administración a los residentes
- name: Documentos
  description: Manual de convivencia, reglas, presupuestos y otros documentos que la administración comparte con quien elige
- name: PQRS
  description: Peticiones, quejas, reclamos y sugerencias
- name: Zonas comunes
  description: Las zonas y sus reglas de reserva
- name: Reservas
  description: Reservas de zonas comunes
- name: Notificaciones
  description: Avisos dentro de la app y al celular
- name: Paquetes
  description: Paquetes que llegan a la portería
- name: Visitas
  description: 'Visitantes: registro, autorización, entrada y salida'
- name: Códigos QR
  description: Códigos QR de acceso para los visitantes
- name: Vehículos
  description: Vehículos de visitantes y de residentes
- name: Legal
  description: Documentos legales (política de datos, términos, cookies y más); públicos
- name: Buscador
  description: Buscar en un solo lugar personas, apartamentos, placas, PQRS, paquetes y visitas
security:
- bearerAuth: []
paths:
  /api/admin/apartments:
    get:
      tags:
      - Estructura
      summary: Listar los apartamentos
      description: '**Quién puede usarla:** Solo administración.'
      operationId: structureListApartments
      x-endpoint: structure.list_apartments
      x-roles:
      - ADMIN
      security:
      - bearerAuth: []
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
        description: Página que quieres (empieza en 1)
      - name: pageSize
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
        description: Cuántos elementos por página (de 1 a 100)
      - name: towerId
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
        description: Solo los de esa torre
      - name: search
        in: query
        required: false
        schema:
          type: string
        description: Texto que se busca en el código y la torre
      responses:
        '200':
          description: Los apartamentos de esta página
          content:
            application/json:
              schema:
                type: object
                required:
                - apartments
                - page
                - pageSize
                - total
                - totalPages
                properties:
                  apartments:
                    type: array
                    items:
                      $ref: '#/components/schemas/Apartment'
                  page:
                    type: integer
                    description: Página que se devuelve (empieza en 1)
                    example: 1
                  pageSize:
                    type: integer
                    description: Cuántos elementos caben en cada página
                    example: 25
                  total:
                    type: integer
                    description: Cuántos elementos hay en total con esos filtros
                  totalPages:
                    type: integer
                    description: Cuántas páginas hay
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
      - Estructura
      summary: Crear un apartamento
      description: '**Quién puede usarla:** Solo administración.'
      operationId: structureCreateApartment
      x-endpoint: structure.create_apartment
      x-roles:
      - ADMIN
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - towerId
              - code
              - floor
              properties:
                towerId:
                  type: integer
                  minimum: 1
                code:
                  type: string
                  description: Código, único en la torre (hasta 20 caracteres)
                  maxLength: 20
                floor:
                  type: integer
                  description: Piso, dentro de los pisos de la torre
                  minimum: 1
      responses:
        '201':
          description: Apartamento creado
          content:
            application/json:
              schema:
                type: object
                required:
                - message
                - apartment
                properties:
                  message:
                    type: string
                    description: Mensaje para mostrarle a la persona, en español
                  apartment:
                    $ref: '#/components/schemas/Apartment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/admin/apartments/batch:
    post:
      tags:
      - Estructura
      summary: Crear de una vez los apartamentos de un piso
      description: |-
        **Quién puede usarla:** Solo administración.

        El código es el piso seguido del número con dos cifras: el piso 3 con 4 apartamentos da 301, 302, 303 y 304. Si alguno ya existe, no se crea ninguno. Se indica `count` o `to`, no los dos.
      operationId: structureCreateFloorApartments
      x-endpoint: structure.create_floor_apartments
      x-roles:
      - ADMIN
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - towerId
              - floor
              properties:
                towerId:
                  type: integer
                  minimum: 1
                floor:
                  type: integer
                  minimum: 1
                from:
                  type: integer
                  description: Primer número del piso (por defecto 1)
                  minimum: 1
                  maximum: 99
                count:
                  type: integer
                  description: Cuántos apartamentos tiene el piso
                  minimum: 1
                  maximum: 99
                to:
                  type: integer
                  description: Último número del piso (en lugar de count)
                  minimum: 1
                  maximum: 99
      responses:
        '201':
          description: Apartamentos creados
          content:
            application/json:
              schema:
                type: object
                required:
                - message
                - apartments
                properties:
                  message:
                    type: string
                    description: Mensaje para mostrarle a la persona, en español
                  apartments:
                    type: array
                    items:
                      $ref: '#/components/schemas/Apartment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/admin/apartments/{apartment_id}:
    get:
      tags:
      - Estructura
      summary: Ver un apartamento
      description: '**Quién puede usarla:** Solo administración.'
      operationId: structureGetApartment
      x-endpoint: structure.get_apartment
      x-roles:
      - ADMIN
      security:
      - bearerAuth: []
      parameters:
      - name: apartment_id
        in: path
        required: true
        description: Id del apartamento
        schema:
          type: integer
          minimum: 1
      responses:
        '200':
          description: El apartamento
          content:
            application/json:
              schema:
                type: object
                required:
                - apartment
                properties:
                  apartment:
                    $ref: '#/components/schemas/Apartment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags:
      - Estructura
      summary: Editar un apartamento
      description: |-
        **Quién puede usarla:** Solo administración.

        Un apartamento no cambia de torre: se retira y se crea en la otra.
      operationId: structureUpdateApartment
      x-endpoint: structure.update_apartment
      x-roles:
      - ADMIN
      security:
      - bearerAuth: []
      parameters:
      - name: apartment_id
        in: path
        required: true
        description: Id del apartamento
        schema:
          type: integer
          minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Al menos un dato.
              properties:
                code:
                  type: string
                  maxLength: 20
                floor:
                  type: integer
                  minimum: 1
      responses:
        '200':
          description: Apartamento actualizado
          content:
            application/json:
              schema:
                type: object
                required:
                - message
                - apartment
                properties:
                  message:
                    type: string
                    description: Mensaje para mostrarle a la persona, en español
                  apartment:
                    $ref: '#/components/schemas/Apartment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags:
      - Estructura
      summary: Retirar un apartamento
      description: '**Quién puede usarla:** Solo administración.'
      operationId: structureRetireApartment
      x-endpoint: structure.retire_apartment
      x-roles:
      - ADMIN
      security:
      - bearerAuth: []
      parameters:
      - name: apartment_id
        in: path
        required: true
        description: Id del apartamento
        schema:
          type: integer
          minimum: 1
      responses:
        '200':
          description: Apartamento retirado (queda guardado, no se borra)
          content:
            application/json:
              schema:
                type: object
                required:
                - message
                - apartment
                properties:
                  message:
                    type: string
                    description: Mensaje para mostrarle a la persona, en español
                  apartment:
                    $ref: '#/components/schemas/Apartment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/admin/archive-history:
    post:
      tags:
      - Administración
      summary: Archivar el historial resuelto
      description: |-
        **Quién puede usarla:** Solo administración.

        Archiva las PQRS resueltas y las reservas rechazadas, canceladas o pasadas, y devuelve el expediente en Excel. Nada se borra: solo se archiva.
      operationId: communityArchiveHistory
      x-endpoint: community.archive_history
      x-roles:
      - ADMIN
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Historial archivado
          content:
            application/json:
              schema:
                type: object
                required:
                - message
                - archivedPqrsCount
                - archivedReservationsCount
                - fileName
                - mimeType
                - base64
                properties:
                  message:
                    type: string
                    description: Mensaje para mostrarle a la persona, en español
                  archivedPqrsCount:
                    type: integer
                  archivedReservationsCount:
                    type: integer
                  fileName:
                    type: string
                  mimeType:
                    type: string
                  base64:
                    type: string
                    description: Expediente en base64
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/admin/census-template:
    get:
      tags:
      - Administración
      summary: Descargar la plantilla de Excel del censo
      description: '**Quién puede usarla:** Solo administración.'
      operationId: adminGetCensusTemplate
      x-endpoint: admin.get_census_template
      x-roles:
      - ADMIN
      security:
      - bearerAuth: []
      responses:
        '200':
          description: La plantilla en base64
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArchivoExcel'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/admin/export/legal-report:
    get:
      tags:
      - Administración
      summary: Descargar el reporte legal en Excel
      description: |-
        **Quién puede usarla:** Solo administración.

        PQRS, mensajes, reservas y registro de auditoría.
      operationId: adminGetLegalReport
      x-endpoint: admin.get_legal_report
      x-roles:
      - ADMIN
      security:
      - bearerAuth: []
      responses:
        '200':
          description: El reporte en base64
          content:
            application/json:
              schema:
                type: object
                required:
                - message
                - fileName
                - mimeType
                - base64
                - pqrsCount
                - pqrsMessagesCount
                - reservationsCount
                - auditLogsCount
                properties:
                  message:
                    type: string
                  fileName:
                    type: string
                  mimeType:
                    type: string
                  base64:
                    type: string
                    description: Contenido en base64
                  pqrsCount:
                    type: integer
                  pqrsMessagesCount:
                    type: integer
                  reservationsCount:
                    type: integer
                  auditLogsCount:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/admin/import-census:
    post:
      tags:
      - Administración
      summary: Importar el censo desde Excel o CSV
      description: |-
        **Quién puede usarla:** Solo administración.

        Crea o actualiza residentes y las fichas de sus hogares. Quien lo sube confirma que la unidad tiene la autorización de tratamiento de datos de cada residente. Los residentes nuevos quedan con una contraseña que nadie conoce: la administración les asigna una desde la lista de usuarios.
      operationId: adminPostImportCensus
      x-endpoint: admin.post_import_census
      x-roles:
      - ADMIN
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - fileBase64
              - fileName
              - dataProcessingConsent
              properties:
                fileBase64:
                  type: string
                  description: El archivo en base64 (se acepta el prefijo «data:...;base64,»)
                fileName:
                  type: string
                  description: Nombre del archivo, por ejemplo censo.xlsx
                dataProcessingConsent:
                  type: boolean
                  description: Debe ser verdadero
                  enum:
                  - true
      responses:
        '200':
          description: Importación procesada
          content:
            application/json:
              schema:
                type: object
                required:
                - message
                - createdUsers
                - updatedUsers
                - unitsProcessed
                - errors
                properties:
                  message:
                    type: string
                    description: Mensaje para mostrarle a la persona, en español
                  createdUsers:
                    type: integer
                    description: Cuentas nuevas
                  updatedUsers:
                    type: integer
                    description: Cuentas que se actualizaron
                  unitsProcessed:
                    type: integer
                    description: Apartamentos tocados
                  errors:
                    type: array
                    items:
                      type: string
                    description: 'Una línea por cada fila que no se pudo procesar, con «Fila N: motivo»'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
  /api/admin/parking-spots:
    get:
      tags:
      - Estructura
      summary: Listar los parqueaderos
      description: '**Quién puede usarla:** Solo administración.'
      operationId: structureListParkingSpots
      x-endpoint: structure.list_parking_spots
      x-roles:
      - ADMIN
      security:
      - bearerAuth: []
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
        description: Página que quieres (empieza en 1)
      - name: pageSize
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
        description: Cuántos elementos por página (de 1 a 100)
      - name: type
        in: query
        required: false
        schema:
          type: string
          enum:
          - residente
          - visitante
        description: Solo los de ese tipo
      - name: assigned
        in: query
        required: false
        schema:
          type: boolean
        description: Solo los asignados a un apartamento (o los libres si es falso). Acepta true, false, 1, 0, si
          y no.
      - name: occupied
        in: query
        required: false
        schema:
          type: boolean
        description: Solo los ocupados por un vehículo de visitante (o los libres si es falso). Acepta true, false,
          1, 0, si y no.
      - name: search
        in: query
        required: false
        schema:
          type: string
        description: Texto que se busca en el código y la ubicación
      responses:
        '200':
          description: Los parqueaderos de esta página
          content:
            application/json:
              schema:
                type: object
                required:
                - parkingSpots
                - page
                - pageSize
                - total
                - totalPages
                properties:
                  parkingSpots:
                    type: array
                    items:
                      $ref: '#/components/schemas/ParkingSpot'
                  page:
                    type: integer
                    description: Página que se devuelve (empieza en 1)
                    example: 1
                  pageSize:
                    type: integer
                    description: Cuántos elementos caben en cada página
                    example: 25
                  total:
                    type: integer
                    description: Cuántos elementos hay en total con esos filtros
                  totalPages:
                    type: integer
                    description: Cuántas páginas hay
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
      - Estructura
      summary: Crear un parqueadero
      description: |-
        **Quién puede usarla:** Solo administración.

        El de visitantes empieza libre y no se asigna a un apartamento.
      operationId: structureCreateParkingSpot
