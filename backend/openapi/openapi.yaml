    UnitRules:
      type: object
      description: Las reglas vigentes de la unidad. Donde la administración no cambió nada rige el valor de DOMUX.
      required:
      - pqrsTermDays
      - pqrsWarningDays
      - pqrsTermsByCategory
      - packageOrangeHours
      - packageRedHours
      - visitorParkingMaxDays
      - visitMaxStayDays
      - qrMaxPeople
      - qrMaxValidDays
      - autoQrMinStayDays
      - deliveredArchiveDays
      - motosPerCarSpot
      properties:
        pqrsTermDays:
          type: integer
          description: Días hábiles para responder una PQRS (de 1 a 90; por defecto 15)
          minimum: 1
          maximum: 90
          example: 15
        pqrsWarningDays:
          type: integer
          description: Con estos días hábiles o menos por vencer, el semáforo de una PQRS pasa a amarillo (de 1 a 30, sin pasar del plazo general; por defecto 5)
          minimum: 1
          maximum: 30
          example: 5
        pqrsTermsByCategory:
          type: object
          description: Plazo propio, en días hábiles, de los tipos de PQRS que no usan el general. Las llaves son Petición, Queja, Reclamo, Sugerencia o Daño; un tipo que no aparece usa el plazo general.
          additionalProperties:
            type: integer
            minimum: 1
            maximum: 90
          example:
            Daño: 5
        packageOrangeHours:
          type: integer
          description: Horas sin reclamar para que un paquete se ponga en naranja (de 1 a 720; por defecto 48)
          minimum: 1
          maximum: 720
          example: 48
        packageRedHours:
          type: integer
          description: Horas sin reclamar para que un paquete se ponga en rojo (de 2 a 1440, más que las del naranja; por defecto 72)
          minimum: 2
          maximum: 1440
          example: 72
        visitorParkingMaxDays:
          type: integer
          description: Días que un vehículo visitante puede quedarse en el parqueadero (de 1 a 30; por defecto 3, o el de la variable de entorno VISITOR_PARKING_MAX_DAYS)
          minimum: 1
          maximum: 30
          example: 3
        visitMaxStayDays:
          type: integer
          description: Días máximos de estadía que se pueden anotar en una visita (de 1 a 90; por defecto 30)
          minimum: 1
          maximum: 90
          example: 30
        qrMaxPeople:
          type: integer
          description: Personas que caben en un QR de visita (de 1 a 20; por defecto 5)
          minimum: 1
          maximum: 20
          example: 5
        qrMaxValidDays:
          type: integer
          description: Vigencia máxima de un QR de visita en días (de 1 a 90; por defecto 30)
          minimum: 1
          maximum: 90
          example: 30
        autoQrMinStayDays:
          type: integer
          description: Desde cuántos días de estadía el QR de la visita se crea solo (de 1 a 30; por defecto 2)
          minimum: 1
          maximum: 30
          example: 2
        deliveredArchiveDays:
          type: integer
          description: Días que un paquete entregado tarda en archivarse solo (de 1 a 90; por defecto 7)
          minimum: 1
          maximum: 90
          example: 7
        motosPerCarSpot:
          type: integer
          description: Motos que caben en un parqueadero de carro de visitantes (de 1 a 10; por defecto 6)
          minimum: 1
          maximum: 10
          example: 6
    UnitRulesInput:
      type: object
      description: Al menos una regla. Una regla enviada como `null` vuelve al valor de DOMUX; `pqrsTermsByCategory` reemplaza la lista completa (con `null` o `{}` se quitan todos los plazos propios).
      properties:
        pqrsTermDays:
          type: integer
          nullable: true
          minimum: 1
          maximum: 90
        pqrsWarningDays:
          type: integer
          nullable: true
          minimum: 1
          maximum: 30
        pqrsTermsByCategory:
          type: object
          nullable: true
          additionalProperties:
            type: integer
            minimum: 1
            maximum: 90
          example:
            Daño: 5
        packageOrangeHours:
          type: integer
          nullable: true
          minimum: 1
          maximum: 720
        packageRedHours:
          type: integer
          nullable: true
          minimum: 2
          maximum: 1440
        visitorParkingMaxDays:
          type: integer
          nullable: true
          minimum: 1
          maximum: 30
        visitMaxStayDays:
          type: integer
          nullable: true
          minimum: 1
          maximum: 90
        qrMaxPeople:
          type: integer
          nullable: true
          minimum: 1
          maximum: 20
        qrMaxValidDays:
          type: integer
          nullable: true
          minimum: 1
          maximum: 90
        autoQrMinStayDays:
          type: integer
          nullable: true
          minimum: 1
          maximum: 30
        deliveredArchiveDays:
          type: integer
          nullable: true
          minimum: 1
          maximum: 90
        motosPerCarSpot:
          type: integer
          nullable: true
          minimum: 1
          maximum: 10
    UnitRulesView:
      type: object
      description: Lo que ve la administración al revisar las reglas de la unidad.
      required:
