      description: |-
        **Quién puede usarla:** Solo portería.

        El guardia que entra se identifica con su PIN sin cerrar la sesión de la tablet. La respuesta trae el token del guardia nuevo y, desde ahí, cada registro queda a su nombre. Al quinto PIN incorrecto seguido, el PIN de ese guardia queda bloqueado 15 minutos.
      operationId: authGuardShift
      x-endpoint: auth.guard_shift
      x-roles:
      - GUARD
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - guardId
              - pin
              properties:
                guardId:
                  type: integer
                  description: Id del guardia que toma el turno
                  minimum: 1
                pin:
                  type: string
                  description: PIN de exactamente 4 dígitos, escrito como texto
                  pattern: ^[0-9]{4}$
      responses:
        '200':
          description: Turno tomado
          content:
            application/json:
              schema:
                type: object
                required:
                - message
                - token
                - user
                properties:
                  message:
                    type: string
                    description: Mensaje para mostrarle a la persona, en español
                  token:
                    type: string
                    description: Token del guardia nuevo (JWT)
                  user:
                    $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
