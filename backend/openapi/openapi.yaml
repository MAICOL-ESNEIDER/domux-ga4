            type: string
          description: 'Solo en 409 al guardar la ficha del hogar: las placas que ya están en otro hogar'
        noFreeSpots:
          type: boolean
          description: 'Solo en 409 al registrar un vehículo: verdadero si no quedan parqueaderos de visitantes
            libres'
        suggestedSpot:
