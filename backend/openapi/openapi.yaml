  /api/reservations:
    get:
      tags:
      - Reservas
      summary: Listar las reservas
      description: |-
        **Quién puede usarla:** Solo administración, residentes.

        Un residente ve las suyas y la administración, todas. **Sin `view`** devuelve la lista completa, con conversación y adjuntos, sin páginas (la que usa la app). **Con `view=summary`** devuelve la lista liviana y paginada de la web, con lo que más urge primero y con `counts` por estado.
      operationId: communityGetReservations
      x-endpoint: community.get_reservations
      x-roles:
      - ADMIN
      - RESIDENT
      security:
      - bearerAuth: []
      parameters:
      - name: view
        in: query
        required: false
        schema:
          type: string
          enum:
          - summary
        description: Con `summary` la respuesta es la lista liviana y paginada que usa la web.
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - por_aprobar
          - pendiente
          - activa
          - aprobada
          - rechazada
          - cancelada
        description: Un estado, o `por_aprobar` para las pendientes
      - name: commonAreaId
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
        description: Solo las de esa zona
      - name: dateFrom
        in: query
        required: false
        schema:
          type: string
          format: date
        description: Solo las de ese día en adelante, AAAA-MM-DD
      - name: dateTo
        in: query
        required: false
        schema:
          type: string
          format: date
        description: Solo las hasta ese día, AAAA-MM-DD
      - name: search
        in: query
        required: false
        schema:
          type: string
        description: Texto que se busca (también se acepta con el nombre `q`)
      - name: includeArchived
        in: query
        required: false
        schema:
          type: boolean
        description: Verdadero incluye las archivadas. Acepta true, false, 1, 0, si y no.
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
        description: Página que quieres (empieza en 1)
      - name: pageSize
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 25
        description: Cuántos elementos por página (de 1 a 100)
      responses:
        '200':
          description: Las reservas
          content:
            application/json:
              schema:
                type: object
                required:
                - reservations
                properties:
                  reservations:
                    type: array
                    items:
                      oneOf:
                      - $ref: '#/components/schemas/Reservation'
                      - $ref: '#/components/schemas/ReservationSummary'
                    description: Con view=summary son filas livianas (ReservationSummary)
                  page:
                    type: integer
                    description: Solo con view=summary
                  pageSize:
                    type: integer
                    description: Solo con view=summary
                  total:
                    type: integer
                    description: Solo con view=summary
                  totalPages:
                    type: integer
                    description: Solo con view=summary
                  counts:
                    type: object
                    description: 'Solo con view=summary: cuántas reservas hay de cada estado'
                    required:
                    - pending
                    - approved
                    - rejected
                    - cancelled
                    - all
                    properties:
                      pending:
                        type: integer
                      approved:
                        type: integer
                      rejected:
                        type: integer
                      cancelled:
                        type: integer
                      all:
                        type: integer
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
      - Reservas
      summary: Pedir una reserva
      description: |-
        **Quién puede usarla:** Solo administración, residentes.

        Queda pendiente hasta que la administración la apruebe. A un residente se le revisan el límite de una por día, el semanal de la zona y la anticipación; los menores sin autorización parental no pueden reservar. La administración puede crearla a nombre de un residente con `residentId`. Adjuntos: image, video o audio, y también document (PDF).
      operationId: communityCreateReservation
      x-endpoint: community.create_reservation
      x-roles:
      - ADMIN
      - RESIDENT
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - commonAreaId
              - date
              - timeSlot
              properties:
                commonAreaId:
                  type: integer
                  description: Zona común
                  minimum: 1
                date:
                  type: string
                  description: Día que se reserva (hoy o después), AAAA-MM-DD
                  example: '2026-12-01'
                  format: date
                timeSlot:
                  type: string
                  description: Franja «HH:MM-HH:MM» que existe en la zona (o su franja de día completo)
                  example: 08:00-10:00
                attendees:
                  type: integer
                  description: Cuántas personas asistirán (no puede pasar del aforo)
                  minimum: 1
                message:
                  type: string
                  description: Mensaje para la administración
                residentId:
                  type: integer
                  description: 'Solo administración: el residente a nombre de quien se reserva'
                  minimum: 1
                mediaUrl:
                  type: string
                  description: Archivo como «data:<tipo>;base64,<datos>». El servidor revisa el contenido real del
                    archivo y no deja pasar más de 6 MB. Si se envía, hay que enviar también mediaType.
                mediaType:
                  type: string
                  description: Tipo del archivo
                  enum:
                  - image
                  - video
                  - audio
                  - document
                mediaDownloadable:
                  type: boolean
                  description: Si quien lo ve puede descargarlo (por defecto, sí)
      responses:
        '201':
          description: Reserva creada
          content:
            application/json:
              schema:
                type: object
                required:
                - message
                - reservation
                properties:
                  message:
                    type: string
                    description: Mensaje para mostrarle a la persona, en español
                  reservation:
                    $ref: '#/components/schemas/Reservation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
