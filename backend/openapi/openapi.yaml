      description: |-
        **Quién puede usarla:** Solo administración, portería, residentes.

        La administración y la portería ven todas; un residente, las de su apartamento. **Con `view=summary`** devuelve la lista liviana (sin fotos ni eventos) con `counts`.
      operationId: securityGetVisits
      x-endpoint: security.get_visits
      x-roles:
      - ADMIN
      - GUARD
      - RESIDENT
      security:
      - bearerAuth: []
      parameters:
      - name: view
        in: query
        required: false
        schema:
          type: string
          enum:
          - summary
        description: Con `summary` la respuesta es la lista liviana y paginada que usa la web.
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - pendiente
          - aprobada
          - rechazada
        description: Solo las que están en ese estado de autorización
      - name: search
        in: query
        required: false
        schema:
          type: string
        description: Texto que se busca en el visitante, el residente y el apartamento
      - name: apartmentId
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
        description: Solo las de ese apartamento
      - name: from
        in: query
        required: false
        schema:
          type: string
          format: date
        description: Desde ese día (Colombia), AAAA-MM-DD
      - name: to
        in: query
        required: false
        schema:
          type: string
          format: date
        description: Hasta ese día incluido (Colombia), AAAA-MM-DD
      - name: inside
        in: query
        required: false
        schema:
          type: boolean
        description: Verdadero trae solo las que entraron y todavía no salieron. Acepta true, false, 1, 0, si y
          no.
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
        description: Página que quieres (empieza en 1)
      - name: pageSize
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
        description: Cuántos elementos por página (de 1 a 200)
      responses:
        '200':
          description: Las visitas de esta página
          content:
            application/json:
              schema:
                type: object
                required:
                - visits
                - page
                - pageSize
                - total
                - totalPages
                properties:
                  visits:
                    type: array
                    items:
                      oneOf:
                      - $ref: '#/components/schemas/Visit'
                      - $ref: '#/components/schemas/VisitSummary'
                  page:
                    type: integer
                    description: Página que se devuelve (empieza en 1)
                    example: 1
                  pageSize:
                    type: integer
                    description: Cuántos elementos caben en cada página
                    example: 25
                  total:
                    type: integer
                    description: Cuántos elementos hay en total con esos filtros
                  totalPages:
                    type: integer
                    description: Cuántas páginas hay
                  counts:
                    type: object
                    description: Solo con view=summary
                    required:
                    - inside
                    - pending
                    - approved
                    - rejected
                    - all
                    properties:
                      inside:
                        type: integer
                        description: Adentro ahora
                      pending:
                        type: integer
                        description: Por autorizar
                      approved:
                        type: integer
                        description: Autorizadas
                      rejected:
                        type: integer
                        description: Rechazadas
                      all:
                        type: integer
                        description: Total
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
      - Visitas
      summary: Registrar un visitante en portería
      description: |-
        **Quién puede usarla:** Solo portería.

        Queda pendiente y se le avisa al residente para que lo autorice. El documento es obligatorio, o se marca `documentRefused` si no lo quiso dar. Para guardar el documento o una foto hace falta `mediaConsent`.
      operationId: securityRegisterVisit
      x-endpoint: security.register_visit
      x-roles:
      - GUARD
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - visitorName
              - residentId
              - type
              properties:
                visitorName:
                  type: string
                  description: Nombre del visitante
                residentId:
                  type: integer
                  description: Residente que visita
                  minimum: 1
                type:
                  type: string
                  enum:
                  - visitante
                  - domiciliario
                  - contratista
                visitorDocument:
                  type: string
                  description: Documento del visitante (hasta 40 caracteres)
                  maxLength: 40
                documentRefused:
                  type: boolean
                  description: «No quiso darlo». No se puede enviar junto con el documento
                mediaConsent:
                  type: boolean
