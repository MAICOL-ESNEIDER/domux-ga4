    User:
      type: object
      description: Una cuenta de la aplicación.
      required:
      - id
      - name
      - firstName
      - lastName
      - fullName
      - email
      - phone
      - documentId
      - role
      - hasPin
      - apartmentId
      - apartment
      - apartmentNumber
      - occupancyType
      - socialNetworks
      - birthDate
      - age
      - isMinor
      - parentalConsent
      - dataProcessingConsent
      - dataProcessingConsentAt
      - isActive
      - mustChangePassword
      - legalAcceptanceRequired
      - legalAcceptedAt
      - createdAt
      properties:
        id:
          type: integer
          description: Identificador de la persona
        name:
          type: string
          description: Nombre completo (igual que fullName)
        firstName:
          type: string
          description: Nombres
        lastName:
          type: string
          description: Apellidos (puede estar vacío)
        fullName:
          type: string
          description: Nombres y apellidos
        email:
          type: string
          description: Correo con el que inicia sesión
        phone:
          type: string
          description: Teléfono de Colombia con 10 números, o vacío
          example: '3001234567'
        documentId:
          type: string
          description: Documento de identidad (puede estar vacío)
        role:
          type: string
          description: Rol de la persona
          enum:
          - ADMIN
          - GUARD
          - RESIDENT
        hasPin:
          type: boolean
          description: Si el guardia tiene PIN de turno. El PIN nunca se devuelve
        apartmentId:
          type: integer
          description: Apartamento de un residente
          nullable: true
        apartment:
          type: string
          description: Apartamento escrito como «Torre 1 · Apto 101»
          nullable: true
        apartmentNumber:
          type: integer
          description: Número del apartamento, sirve para ordenar
          nullable: true
        occupancyType:
          type: string
          description: Tipo de ocupación (de los residentes)
          enum:
          - propietario
          - arrendatario
          - residente
        socialNetworks:
          type: string
          description: Redes sociales (texto libre, máximo 500 caracteres)
        birthDate:
          type: string
          description: Fecha de nacimiento, AAAA-MM-DD
          nullable: true
          example: '2026-12-01'
          format: date
        age:
          type: integer
          description: Edad en años
          nullable: true
        isMinor:
          type: boolean
          description: Si es menor de edad
        parentalConsent:
          type: boolean
          description: Si un adulto autorizó a un menor a usar la cuenta
        dataProcessingConsent:
          type: boolean
          description: Si autorizó el tratamiento de datos (Ley 1581 de 2012)
        dataProcessingConsentAt:
          type: string
          description: Hora de Colombia, AAAA-MM-DD HH:MM
          nullable: true
          example: 2026-11-10 21:30
          pattern: ^\d{4}-\d{2}-\d{2} \d{2}:\d{2}$
        isActive:
          type: boolean
          description: Falso si la cuenta está desactivada (no puede entrar)
        mustChangePassword:
          type: boolean
          description: Verdadero si debe cambiar la contraseña que le puso el administrador
        legalAcceptanceRequired:
          type: boolean
          description: Verdadero si debe leer y aceptar los textos legales (nunca aceptó, o cambiaron desde entonces)
        legalAcceptedAt:
          type: string
          description: Hora de Colombia en que aceptó los textos legales, AAAA-MM-DD HH:MM; nulo si nunca aceptó
          nullable: true
          example: 2026-11-25 18:30
          pattern: ^\d{4}-\d{2}-\d{2} \d{2}:\d{2}$
        createdAt:
          type: string
          description: Hora de Colombia, AAAA-MM-DD HH:MM
          nullable: true
          example: 2026-11-10 21:30
          pattern: ^\d{4}-\d{2}-\d{2} \d{2}:\d{2}$
