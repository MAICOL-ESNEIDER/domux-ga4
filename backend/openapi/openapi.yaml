  /api/pqrs:
    get:
      tags:
      - PQRS
      summary: Listar las PQRS
      description: |-
        **Quién puede usarla:** Solo administración, residentes.

        Un residente ve las suyas y la administración, todas. **Sin `view`** devuelve la lista completa, con conversación y adjuntos, sin páginas (es la que usa la app). **Con `view=summary`** devuelve la lista liviana y paginada de la bandeja de la web, con las más urgentes primero.
      operationId: communityGetPqrs
      x-endpoint: community.get_pqrs
      x-roles:
      - ADMIN
      - RESIDENT
      security:
      - bearerAuth: []
      parameters:
      - name: view
        in: query
        required: false
        schema:
          type: string
          enum:
          - summary
        description: Con `summary` la respuesta es la lista liviana y paginada que usa la web.
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - abierta
          - en_proceso
          - resuelta
        description: Solo las que están en ese estado
      - name: category
        in: query
        required: false
        schema:
          type: string
        description: Solo las de esa categoría (texto exacto)
      - name: search
        in: query
        required: false
        schema:
          type: string
        description: Texto que se busca (también se acepta con el nombre `q`)
      - name: residentId
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
        description: 'Solo administración: las PQRS de ese residente'
      - name: semaphore
        in: query
        required: false
        schema:
          type: string
          enum:
          - verde
          - amarillo
          - rojo
        description: Solo las que están en curso con ese color de plazo
      - name: includeArchived
        in: query
        required: false
        schema:
          type: boolean
        description: Verdadero incluye las archivadas. Acepta true, false, 1, 0, si y no.
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
        description: Página que quieres (empieza en 1)
      - name: pageSize
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 25
        description: Cuántos elementos por página (de 1 a 100)
      responses:
        '200':
          description: Las PQRS
          content:
            application/json:
              schema:
                type: object
                required:
                - pqrs
                properties:
                  pqrs:
                    type: array
                    items:
                      oneOf:
                      - $ref: '#/components/schemas/Pqrs'
                      - $ref: '#/components/schemas/PqrsSummary'
                    description: Con view=summary son filas livianas (PqrsSummary)
                  page:
                    type: integer
                    description: Solo con view=summary
                  pageSize:
                    type: integer
                    description: Solo con view=summary
                  total:
                    type: integer
                    description: Solo con view=summary
                  totalPages:
                    type: integer
                    description: Solo con view=summary
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags:
      - PQRS
      summary: Radicar una PQRS
      description: |-
        **Quién puede usarla:** Solo administración, residentes.

        Un residente puede tener máximo 3 PQRS activas a la vez (si no, responde 409). Los menores de edad sin autorización parental no pueden radicar (403). La administración puede radicarla a nombre de un residente con `residentId`. Adjuntos: image, video o audio, y también document (PDF).
      operationId: communityCreatePqrs
      x-endpoint: community.create_pqrs
      x-roles:
      - ADMIN
      - RESIDENT
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - subject
              - message
              properties:
                subject:
                  type: string
                  description: Asunto
                message:
                  type: string
                  description: Lo que quiere decir
                category:
                  type: string
                  description: Petición, queja, reclamo o sugerencia (texto, hasta 40 caracteres; por defecto «Petición»)
                  maxLength: 40
                residentId:
                  type: integer
                  description: 'Solo administración: el residente a nombre de quien se radica'
                  minimum: 1
                incidentDate:
                  type: string
                  description: Día en que pasó, AAAA-MM-DD
                  nullable: true
                  example: '2026-12-01'
                  format: date
                incidentTime:
                  type: string
                  description: Hora en que pasó, HH:MM
                  nullable: true
                  example: 08:00
                  pattern: ^\d{2}:\d{2}$
                mediaUrl:
                  type: string
                  description: Archivo como «data:<tipo>;base64,<datos>». El servidor revisa el contenido real del
                    archivo y no deja pasar más de 6 MB. Si se envía, hay que enviar también mediaType.
                mediaType:
                  type: string
                  description: Tipo del archivo
                  enum:
                  - image
                  - video
                  - audio
                  - document
                mediaDownloadable:
                  type: boolean
                  description: Si quien lo ve puede descargarlo (por defecto, sí)
      responses:
        '201':
          description: PQRS radicada
          content:
            application/json:
              schema:
                type: object
                required:
                - message
                - pqrs
                properties:
                  message:
                    type: string
                    description: Mensaje para mostrarle a la persona, en español
                  pqrs:
                    $ref: '#/components/schemas/Pqrs'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
